[application]
log_level = INFO
config_dir = config
log_dir = logs
data_dir = data

[appearance]
theme = dark
reduced_motion = false

[plc]
mode = simulated
host = 127.0.0.1
port = 44818
timeout_seconds = 2.0
reconnect_interval_seconds = 5.0
simulate_connection_error = false

[camera]
backend = simulated
device = /dev/video0
sensor_id = 0
profile = balanced
width = 320
height = 240
frames_per_second = 10
pixel_format = AUTO
timeout_seconds = 3.0
reconnect_interval_seconds = 5.0
buffer_count = 4
rotation_degrees = 0
horizontal_flip = false
vertical_flip = false
fallback_to_simulator = true

[inference]
enabled = true
confidence_threshold = 0.50
engine = simulated
model_path = models/best.pt
device = auto
iou_threshold = 0.70
image_size = 640

[inspection]
expected_label = pieza
minimum_confidence = 0.85
minimum_objects = 1
maximum_objects = 1

[production]
quality_threshold_percent = 85.0
cycle_timeout_seconds = 3.0
maximum_frame_age_ms = 500
plc_poll_interval_ms = 250

[io.trigger_inspection]
tag = trigger_inspection
data_type = bool
direction = input
writable = false

[io.machine_ready]
